name: Scheduled YouTube Video Upload

on:
  schedule:
    # Täglich um 16:25 UTC (ca. 17:25 MEZ / 18:25 MESZ, vermeidet volle Stunden wegen Cron-Jitter)
    - cron: "25 16 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Optionales Profil (leer = alle aktiven Profile)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Nur simulieren ohne YouTube-Upload und Drive-Papierkorb"
        required: false
        default: "false"
        type: string
      privacy:
        description: "Optionale Sichtbarkeit (public, unlisted, private)"
        required: false
        default: ""
        type: string
      max_uploads:
        description: "Maximale Uploads pro Profil (0 = Profil-Standard)"
        required: false
        default: "0"
        type: string
      video_id:
        description: "Optionale Queue-Video-ID für Einzelupload"
        required: false
        default: ""
        type: string

jobs:
  upload-videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: FFmpeg für exakte Video-Analyse installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-worker.txt"

      - name: Worker-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Geplanten Video-Upload ausführen
        env:
          PYTHONUNBUFFERED: "1"
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PRIVACY: ${{ inputs.privacy }}
          INPUT_MAX_UPLOADS: ${{ inputs.max_uploads }}
          INPUT_VIDEO_ID: ${{ inputs.video_id }}
          # Ausschließlich echte Secrets (Non-Secrets wie GEMINI_MODEL, EMAIL_TO, Ordnername kommen aus der Datenbank)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH_ENCRYPTION_KEY: ${{ secrets.OAUTH_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_KEY: ${{ secrets.TURSO_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          ARGS="--trigger-source github_actions"
          if [ -n "$INPUT_PROFILE" ]; then ARGS="$ARGS --profile $INPUT_PROFILE"; fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$INPUT_PRIVACY" ]; then ARGS="$ARGS --privacy $INPUT_PRIVACY"; fi
          if [ -n "$INPUT_MAX_UPLOADS" ] && [ "$INPUT_MAX_UPLOADS" != "0" ]; then ARGS="$ARGS --max-uploads $INPUT_MAX_UPLOADS"; fi
          if [ -n "$INPUT_VIDEO_ID" ]; then ARGS="$ARGS --video-id $INPUT_VIDEO_ID"; fi
          python -m src.worker.cli_worker $ARGS
